<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1610"/>
      <stop offset="50%" stop-color="#100E0A"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <!-- Precision spotlight from upper center-right — showroom atmosphere -->
    <radialGradient id="spot" cx="62%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#C8A060" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#C8A060" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Warm floor reflection from the spot -->
    <radialGradient id="reflect" cx="62%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#C8A060" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Left ambient darkness -->
    <linearGradient id="left-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080604" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#base)"/>
  <rect width="1600" height="700" fill="url(#spot)"/>
  <rect width="1600" height="700" fill="url(#reflect)"/>
  <rect width="1600" height="700" fill="url(#left-dark)"/>
  <!-- Architectural horizon — floor/wall junction -->
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#2A2418" stroke-width="0.8" opacity="0.55"/>
  <!-- Wall surface: large format tile grid, precise and architectural -->
  <line x1="0" y1="175" x2="1600" y2="175" stroke="#1E1A12" stroke-width="0.7" opacity="0.55"/>
  <line x1="0" y1="350" x2="1600" y2="350" stroke="#1E1A12" stroke-width="0.7" opacity="0.55"/>
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#1E1A12" stroke-width="0.7" opacity="0.55"/>
  <line x1="400" y1="0" x2="400" y2="520" stroke="#1A1610" stroke-width="0.6" opacity="0.45"/>
  <line x1="800" y1="0" x2="800" y2="520" stroke="#1A1610" stroke-width="0.6" opacity="0.45"/>
  <line x1="1200" y1="0" x2="1200" y2="520" stroke="#1A1610" stroke-width="0.6" opacity="0.45"/>
  <!-- Floor: generous tile spacing -->
  <line x1="0" y1="610" x2="1600" y2="610" stroke="#181410" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="665" x2="1600" y2="665" stroke="#181410" stroke-width="0.7" opacity="0.35"/>
  <line x1="380" y1="520" x2="368" y2="700" stroke="#181410" stroke-width="0.6" opacity="0.32"/>
  <line x1="780" y1="520" x2="780" y2="700" stroke="#181410" stroke-width="0.6" opacity="0.32"/>
  <line x1="1180" y1="520" x2="1196" y2="700" stroke="#181410" stroke-width="0.6" opacity="0.32"/>
  <!-- Material surface veining on wall — subtle, architectural character -->
  <line x1="0" y1="60" x2="1400" y2="78" stroke="#30261A" stroke-width="0.5" opacity="0.28"/>
  <line x1="100" y1="265" x2="1600" y2="248" stroke="#30261A" stroke-width="0.4" opacity="0.20"/>
  <line x1="0" y1="440" x2="1300" y2="458" stroke="#30261A" stroke-width="0.5" opacity="0.24"/>
  <!-- Spot light cone — subtle wash of warm light from above -->
  <ellipse cx="992" cy="0" rx="320" ry="60" fill="#E0B870" opacity="0.06"/>
  <text x="800" y="685" font-family="system-ui,sans-serif" font-size="10" fill="#2A2018" text-anchor="middle" opacity="0.18" letter-spacing="4">DOĞRULAR SERAMİK — MİMARİ SHOWROOM — MALZEME VE IŞIK</text>
</svg>
