# Doğrular Seramik — nginx ters vekil (reverse proxy) yapılandırması
#
# Sunucuya kurulum:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dogrularseramik
#   sudo ln -s /etc/nginx/sites-available/dogrularseramik /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL satırlarını certbot kendisi ekler — bu dosyayı önce SSL'siz kurun,
# sonra `sudo certbot --nginx -d dogrularseramik.com -d www.dogrularseramik.com`
# çalıştırın. Certbot 443 bloğunu ve yönlendirmeyi otomatik yazar.

# www'suz adresi www'lu adrese yönlendir.
# Sitenin canonical etiketleri, sitemap'i ve JSON-LD verisi
# https://www.dogrularseramik.com üzerine kurulu — www birincil olmalı.
server {
    listen 80;
    listen [::]:80;
    server_name dogrularseramik.com;
    return 308 https://www.dogrularseramik.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.dogrularseramik.com;

    # Yükleme boyutu — örnek talep formu küçük, 5M fazlasıyla yeterli
    client_max_body_size 5M;

    # Sıkıştırma. Görseller zaten WebP, tekrar sıkıştırmaya gerek yok.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # Next.js'in hash'li varlıkları — sonsuza kadar önbelleğe alınabilir
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ altındaki görseller, katalog PDF'leri, video kareleri.
    # 272 MB'lık statik içerik — nginx'in doğrudan servis etmesi
    # Node'a göre çok daha hızlı.
    location ~* ^/(images|kataloglar|frames-mobile|frames-1080|video)/ {
        root /var/www/dogrular-seramik/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @nextjs;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
